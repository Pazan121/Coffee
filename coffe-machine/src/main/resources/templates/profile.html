<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Профіль користувача</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f1ee;
            margin: 0;
            padding: 40px;
            color: #3b2a1f;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 0 15px rgba(0,0,0,0.12);
        }

        h1, h2 {
            color: #5a3b26;
        }

        h1 {
            text-align: center;
        }

        .info {
            margin-top: 25px;
            font-size: 18px;
            line-height: 1.8;
            background: #f7f2ef;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .label {
            font-weight: bold;
            color: #5a3b26;
        }

        .message {
            padding: 12px;
            background: #e8f5e9;
            border: 1px solid #81c784;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .error {
            padding: 12px;
            background: #ffebee;
            border: 1px solid #ef9a9a;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .card-box {
            margin-top: 25px;
            padding: 22px;
            background: #f7f2ef;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .card-preview {
            background: linear-gradient(135deg, #6f4e37, #3b2a1f);
            color: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            min-height: 145px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        .card-number {
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .top-up-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .top-up-form label {
            font-weight: bold;
            color: #5a3b26;
        }

        .top-up-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .full {
            grid-column: 1 / 3;
        }

        .top-up-form button {
            grid-column: 1 / 3;
            background: #6f4e37;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        .top-up-form button:hover {
            background: #4b3323;
        }

        .hint {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .menu {
            margin-top: 30px;
            text-align: center;
        }

        .menu a {
            display: inline-block;
            background: #6f4e37;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 7px;
            margin: 5px;
        }

        .menu a:hover {
            background: #4b3323;
        }

        @media (max-width: 700px) {
            .top-up-form {
                grid-template-columns: 1fr;
            }

            .full,
            .top-up-form button {
                grid-column: 1 / 2;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Профіль користувача</h1>

    <div class="message" th:if="${message}">
        <span th:text="${message}"></span>
    </div>

    <div class="error" th:if="${error}">
        <span th:text="${error}"></span>
    </div>

    <div class="info">
        <p>
            <span class="label">Ім’я:</span>
            <span th:text="${user.name}">user</span>
        </p>

        <p>
            <span class="label">Роль:</span>
            <span th:text="${user.role}">USER</span>
        </p>

        <p>
            <span class="label">Баланс:</span>
            <span th:text="${user.balance} + ' грн'">0 грн</span>
        </p>

        <p>
            <span class="label">Кількість покупок:</span>
            <span th:text="${ordersCount}">0</span>
        </p>
    </div>

    <div class="card-box">
        <h2>Поповнення рахунку банківською карткою</h2>

        <div class="card-preview">
            <div class="card-title">COFFEE CARD</div>
            <div class="card-number">•••• •••• •••• ••••</div>

            <div class="card-row">
                <span>VALID THRU</span>
                <span>CVV</span>
            </div>
        </div>

        <form class="top-up-form" action="/profile/top-up" method="post">
            <div class="full">
                <label>Номер картки</label>
                <input type="text"
                       name="cardNumber"
                       maxlength="19"
                       placeholder="1111 2222 3333 4444"
                       required>
            </div>

            <div>
                <label>Термін дії</label>
                <input type="text"
                       name="expiryDate"
                       placeholder="12/28"
                       required>
            </div>

            <div>
                <label>CVV</label>
                <input type="password"
                       name="cvv"
                       maxlength="3"
                       placeholder="123"
                       required>
            </div>

            <div class="full">
                <label>Сума поповнення</label>
                <input type="number"
                       name="amount"
                       min="1"
                       step="0.01"
                       placeholder="Наприклад, 100"
                       required>
            </div>

            <button type="submit">Поповнити рахунок</button>
        </form>

    </div>

    <div class="menu">
        <a href="/drinks">До напоїв</a>
        <a href="/orders">Мої покупки</a>
        <a href="/logout">Вийти</a>
    </div>
</div>

</body>
</html>
